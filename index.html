<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ESP32 Battery Monitor</title>

<style>
body {
  font-family: Arial;
  background: #FF3DC8;
  color: white;
  text-align: center;
}

.container {
  background: rgba(255,255,255,0.1);
  margin: 20px;
  padding: 20px;
  border-radius: 20px;
}

.bar {
  width: 100%;
  height: 20px;
  background: rgba(255,255,255,0.3);
  border-radius: 10px;
}

.fill {
  height: 100%;
  background: white;
  width: 0%;
}
</style>

</head>

<body>

<div class="container">

<h1>ESP32 Battery Monitor</h1>

<button onclick="connect()">Połącz</button>

<p id="status">Rozłączono</p>

<p>Temperatura: <span id="temp">--</span> °C</p>

<p>Napięcie: <span id="volt">--</span> V</p>

<p>SOC: <span id="soc">--</span> %</p>
<div class="bar">
<div id="socbar" class="fill"></div>
</div>

<p>SOH: <span id="soh">--</span> %</p>
<div class="bar">
<div id="sohbar" class="fill"></div>
</div>

</div>

<script>

let characteristic;

const SERVICE_UUID =
"12345678-1234-1234-1234-123456789abc";

const CHARACTERISTIC_UUID =
"abcd1234-5678-1234-5678-123456789abc";

async function connect(){

const device =
await navigator.bluetooth.requestDevice({
acceptAllDevices:true,
optionalServices:[SERVICE_UUID]
});

const server = await device.gatt.connect();

const service =
await server.getPrimaryService(SERVICE_UUID);

characteristic =
await service.getCharacteristic(CHARACTERISTIC_UUID);

await characteristic.startNotifications();

characteristic.addEventListener(
"characteristicvaluechanged",
handleData
);

document.getElementById("status").innerText="Połączono";

}

function handleData(event){

const value =
new TextDecoder().decode(event.target.value);

const parts=value.split(",");

let temp,volt,soc,soh;

parts.forEach(p=>{

if(p.includes("TEMP"))
temp=p.split(":")[1];

if(p.includes("VOLT"))
volt=p.split(":")[1];

if(p.includes("SOC"))
soc=p.split(":")[1];

if(p.includes("SOH"))
soh=p.split(":")[1];

});

document.getElementById("temp").innerText=temp;
document.getElementById("volt").innerText=volt;
document.getElementById("soc").innerText=soc;
document.getElementById("soh").innerText=soh;

document.getElementById("socbar").style.width=soc+"%";
document.getElementById("sohbar").style.width=soh+"%";

}

</script>

</body>
</html>
