<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ESP32 Battery Monitor</title>

<style>

body{
font-family:Arial;
background:#FF3DC8;
color:white;
text-align:center;
}

.container{
background:rgba(255,255,255,0.1);
margin:20px;
padding:20px;
border-radius:20px;
}

.bar{
width:100%;
height:20px;
background:rgba(255,255,255,0.3);
border-radius:10px;
margin-bottom:10px;
}

.fill{
height:100%;
background:white;
width:0%;
border-radius:10px;
}

.cells{
margin-top:20px;
}

.cell{
margin:5px;
}

button{
padding:10px 20px;
font-size:16px;
border:none;
border-radius:10px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="container">

<h1>ESP32 Battery Monitor</h1>

<button onclick="connect()">Połącz</button>

<p id="status">Rozłączono</p>

<h2>Ogniwa</h2>

<div class="cells">

<p class="cell">Cell 1: <span id="c1">--</span> V</p>
<p class="cell">Cell 2: <span id="c2">--</span> V</p>
<p class="cell">Cell 3: <span id="c3">--</span> V</p>
<p class="cell">Cell 4: <span id="c4">--</span> V</p>

</div>

<h2>Temperatura</h2>

<p><span id="temp">--</span> °C</p>

<h2>Stan naładowania (SOC)</h2>

<p><span id="soc">--</span> %</p>

<div class="bar">
<div id="socbar" class="fill"></div>
</div>

<h2>Stan zdrowia (SOH)</h2>

<p><span id="soh">--</span> %</p>

<div class="bar">
<div id="sohbar" class="fill"></div>
</div>

</div>

<script>

let characteristic;

const SERVICE_UUID =
"12345678-1234-1234-1234-123456789abc";

const CHARACTERISTIC_UUID =
"abcd1234-5678-1234-5678-123456789abc";

async function connect(){

try{

const device =
await navigator.bluetooth.requestDevice({
acceptAllDevices:true,
optionalServices:[SERVICE_UUID]
});

const server = await device.gatt.connect();

const service =
await server.getPrimaryService(SERVICE_UUID);

characteristic =
await service.getCharacteristic(CHARACTERISTIC_UUID);

await characteristic.startNotifications();

characteristic.addEventListener(
"characteristicvaluechanged",
handleData
);

document.getElementById("status").innerText="Połączono";

}
catch(error){
alert("Błąd połączenia: "+error);
}

}

function handleData(event){

const value =
new TextDecoder().decode(event.target.value);

const parts=value.split(",");

let c1,c2,c3,c4,temp,soc,soh;

parts.forEach(p=>{

if(p.includes("C1"))
c1=p.split(":")[1];

if(p.includes("C2"))
c2=p.split(":")[1];

if(p.includes("C3"))
c3=p.split(":")[1];

if(p.includes("C4"))
c4=p.split(":")[1];

if(p.includes("TEMP"))
temp=p.split(":")[1];

if(p.includes("SOC"))
soc=p.split(":")[1];

if(p.includes("SOH"))
soh=p.split(":")[1];

});

if(c1) document.getElementById("c1").innerText=c1;
if(c2) document.getElementById("c2").innerText=c2;
if(c3) document.getElementById("c3").innerText=c3;
if(c4) document.getElementById("c4").innerText=c4;

if(temp) document.getElementById("temp").innerText=temp;

if(soc){

document.getElementById("soc").innerText=soc;
document.getElementById("socbar").style.width=soc+"%";

}

if(soh){

document.getElementById("soh").innerText=soh;
document.getElementById("sohbar").style.width=soh+"%";

}

checkAlarms(c1,c2,c3,c4,temp);

}

function checkAlarms(c1,c2,c3,c4,temp){

let cells=[c1,c2,c3,c4];

cells.forEach(c=>{

if(!c) return;

let v=parseFloat(c);

if(v>4.25){

alert("Uwaga! Przeładowanie ogniwa!");

}

if(v<3.0){

alert("Uwaga! Nadmierne rozładowanie ogniwa!");

}

});

if(temp){

if(parseFloat(temp)>60){

alert("Uwaga! Temperatura baterii zbyt wysoka!");

}

}

}

</script>

</body>
</html>
